name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this workflow only reads the repository to lint, build and
# test. It never writes commits, comments or releases.
permissions:
  contents: read

jobs:
  js:
    name: Types · Vitest · Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, the Vite build) and nothing here
          # needs git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (no emit)
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      # assets/js/ and assets/css/ are committed on purpose, so the plugin
      # installs straight from a checkout with no npm install. That only holds
      # while the committed bundles match the source: rebuild and fail if the
      # tree moves, which catches a TypeScript change that was never rebuilt.
      - name: Committed bundles match source
        run: |
          npm run build:bundle
          git diff --exit-code -- assets/ || {
            echo "::error::assets/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

  php:
    name: PHPUnit · PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # .wp-env.json mounts the sibling `../alcazaba-plugin` checkout so the
      # local QA site has Desktop Mode to host Lienzo. That path does not exist
      # on a runner and wp-env treats a missing mapping as fatal. The override
      # file is merged last and replaces `mappings` wholesale, so this drops the
      # sibling and keeps Lienzo. Nothing is lost: the PHPUnit bootstrap stubs
      # the two Desktop Mode functions Lienzo requires rather than installing it.
      - name: Point wp-env at this repository only
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "mappings": {
              "wp-content/plugins/lienzo": "."
            }
          }
          JSON

      - name: Start wp-env
        run: npm run env:start

      - name: Install PHP dev dependencies
        run: npm run test:php:install

      - name: PHPUnit
        run: npm run test:php

      - name: Coding standards
        run: npx wp-env run cli --env-cwd=wp-content/plugins/lienzo vendor/bin/phpcs

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the bundles
        run: npm run build:bundle

      # See the php job for why this override exists.
      - name: Point wp-env at this repository only
        run: |
          cat > .wp-env.override.json <<'JSON'
          {
            "mappings": {
              "wp-content/plugins/lienzo": "."
            }
          }
          JSON

      - name: Start wp-env
        run: npm run env:start

      # The same command that runs locally, so a green run here means the same
      # thing as a green run on a laptop. It installs Plugin Check on first use
      # and fails the job on any finding at severity 5 or above -- the level
      # that fails the WordPress.org review queue.
      - name: Plugin Check
        run: npm run plugin:check
